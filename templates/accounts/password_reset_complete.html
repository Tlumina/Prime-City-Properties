{% extends 'base.html' %}

{% block title %}Password Reset Complete | {{ site_settings.company_name }}{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm text-center">
                <div class="fs-1 text-success mb-3"><i class="bi bi-check-circle-fill"></i></div>
                <h1 class="h3 font-heading mb-2">Password Changed Successfully!</h1>
                <p class="text-muted small mb-4">Your account password has been updated. You can now sign in with your new password.</p>

                <a href="{% url 'accounts:login' %}" class="btn btn-pc-primary rounded-pill px-5 py-3 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
